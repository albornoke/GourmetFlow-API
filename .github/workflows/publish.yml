name: Publish to GitHub Packages

on:
  push:
    branches: [ main ]
  release:
    types: [ created ]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: albornoke
          server-password: ${{ secrets.PACKAGES_TOKEN }}

      - name: Verify token works for Maven auth
        run: |
          echo "Testing Maven authentication with PACKAGES_TOKEN..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -u "albornoke:${{ secrets.PACKAGES_TOKEN }}" \
            "https://maven.pkg.github.com/albornoke/GourmetFlow-API/com/restaurant/gourmetflow-api/maven-metadata.xml" || true)
          echo "HTTP status code from Maven repository: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "404" ]; then
            echo "✅ Token authentication is working (200=found, 404=not found but authenticated)"
          else
            echo "❌ Token authentication FAILED with status: $HTTP_CODE"
            echo "If 401: the token is invalid or lacks write:packages scope"
            echo "If 403: the token lacks permission for this repository"
            exit 1
          fi

      - name: Build and Deploy with Maven
        run: mvn clean deploy --batch-mode
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN }}