server:
  port: 8080
  error:
    include-stack-trace: never
    include-message: never

spring:
  application:
    name: gourmetflow-api
  
  datasource:
    url: jdbc:postgresql://localhost:5432/gourmetflow_db
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # Ideal para desarrollo iterativo; en producción se gestiona con Flyway
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true # Crea la tabla de control de versiones si la BD está vacía
    locations: classpath:db/migration