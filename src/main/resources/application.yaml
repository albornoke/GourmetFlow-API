server:
  port: 8080
  error:
    include-stack-trace: never # NUNCA exponer trazas de error al exterior
    include-message: never

spring:
  application:
    name: gourmetflow-api

  datasource:
    url: jdbc:postgresql://localhost:5432/gourmetflow_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:secure_password_env}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # Ideal para desarrollo iterativo; en producción se gestiona con Flyway
    show-sql: false # Evitar volcar SQL sensible en consola de producción
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

logging:
  level:
    root: INFO
    com.restaurant.gourmetflow: DEBUG
    org.hibernate.SQL: ERROR