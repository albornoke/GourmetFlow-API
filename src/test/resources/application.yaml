# Configuración de pruebas con base de datos en memoria H2
# Esta configuración sobrescribe a application.yaml solo durante la ejecución de tests.

spring:
  datasource:
    url: jdbc:h2:mem:gourmetflow_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

  # Flyway se deshabilita en pruebas: el esquema lo genera Hibernate a partir
  # de las entidades JPA (ddl-auto=create-drop). Las migraciones usan sintaxis
  # específica de PostgreSQL (BIGSERIAL) que no aplica en H2.
  flyway:
    enabled: false

  # Consola web de H2 disponible en http://localhost:8080/h2-console durante los tests
  h2:
    console:
      enabled: true

# Configuración de seguridad JWE (requerida por JweService al cargar el contexto)
app:
  security:
    jwe:
      secret-key: "x2pDMbdL&3rycHLu!oJP$da5YjKUsy"
